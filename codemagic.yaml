# codemagic.yaml
workflows:
  react-native-android:
    name: UOFK Chem Android Build
    environment:
      vars:
        EXPO_TOKEN: NgU1q-iDP3X7Vse0p0AVsiVNNeJ8op3QuyHcYz66
      node: 20.19.2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Clean caches
        script: |
          npm cache clean --force
          rm -rf node_modules
          rm -rf .expo
          rm -rf node_modules/.cache
      - name: Install dependencies
        script: |
          npm install
      - name: Fix Expo dependencies
        script: |
          npx expo install --fix
      - name: Install EAS CLI
        script: |
          npm install -g eas-cli
      - name: Build APK
        script: |
          eas init --non-interactive --force
          eas build --platform android --profile preview --non-interactive --clear-cache
    artifacts:
      - build/**/*.apk
